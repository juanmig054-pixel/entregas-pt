<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Entregas PT</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--line:#e5e7eb;--pri:#0f766e;--pri2:#ccfbf1;
--pt:#2563eb;--pt2:#dbeafe;--ag:#b45309;--ag2:#fef3c7;--ok:#15803d;--ok2:#dcfce7;--bad:#dc2626;--bad2:#fee2e2;--fab:#7c3aed;--fab2:#ede9fe;--ruta:#0e7490;--ruta2:#cffafe}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--tx:#e8eaed;--mut:#9aa1ab;--line:#2a2f37;--pri:#2dd4bf;--pri2:#134e4a;
--pt:#60a5fa;--pt2:#1e3a5f;--ag:#fbbf24;--ag2:#4a3410;--ok:#4ade80;--ok2:#14391f;--bad:#f87171;--bad2:#4c1d1d;--fab:#c4b5fd;--fab2:#2e1f55;--ruta:#67e8f9;--ruta2:#123c45}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header h1{margin:0;font-size:20px}header small{opacity:.85}
@media (prefers-color-scheme:dark){header{background:#134e4a}}
main{padding:14px 16px 110px;max-width:720px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;border:2px solid transparent}
.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:var(--mut)}
.kpi.on{border-color:var(--pri)}.kpi.red b{color:var(--bad)}
.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border-left:5px solid var(--pt)}
.card.st-ag{border-left-color:var(--ag)}.card.st-venc{border-left-color:var(--bad)}.card.st-desp{border-left-color:var(--ok);opacity:.8}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.ot{font-size:16px;margin-right:auto}.cli{font-weight:600;margin-top:4px}.prod{color:var(--mut);margin:2px 0 6px}
.mut{color:var(--mut)}.sm{font-size:13px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--pt2);color:var(--pt)}
.pill.ag{background:var(--ag2);color:var(--ag)}.pill.venc,.pill.bad{background:var(--bad2);color:var(--bad)}.pill.desp{background:var(--ok2);color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:6}
@media (prefers-color-scheme:dark){#fab{color:#0f1115}}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:10px 0 12px;font-size:12px}
.nav button i{display:block;font-style:normal;font-size:20px}.nav button.on{color:var(--pri);font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheetBody{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#sheetBody h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:700;margin-top:10px}
@media (prefers-color-scheme:dark){.btn{color:#0f1115}}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:13px;margin-top:6px;font-weight:600}.hint.g{color:var(--ok)}.hint.w{color:var(--bad)}
.radio{display:flex;flex-wrap:wrap;gap:6px}
.box{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:10px}.kv:last-child{border:0}
.kv span{color:var(--mut)}.kv b{text-align:right}
.nota{border-left:3px solid var(--pri);padding:6px 10px;margin:8px 0;background:var(--card);border-radius:0 8px 8px 0}
.nota small{color:var(--mut);display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;background:var(--card);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border:2px solid transparent;position:relative}
.day.off{opacity:.35}.day.some{background:var(--ag2)}.day.full{background:var(--bad2)}
.day.today{border-color:var(--pri)}.day.sel{background:var(--pri);color:#fff}
.day em{font-style:normal;font-size:10px;font-weight:700}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.leg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:10px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.vrow{display:flex;gap:6px;margin-bottom:6px}.vrow button{flex:none;width:46px;border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:10px;font-size:18px}
.big{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:.95}
.irow{display:grid;grid-template-columns:30px 62px 1fr 38px;gap:6px;align-items:center;margin-bottom:6px}
.irow input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.irow input,.irow textarea{padding:8px;font-size:14px}.irow textarea{font-size:13px;resize:none;line-height:1.3}.irow.off input:not([type=checkbox]),.irow.off textarea{opacity:.4;text-decoration:line-through}
.irow button{border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:8px;height:38px;font-size:16px}
.adj{display:flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px}
.adj span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:10px;padding:12px;margin-bottom:6px;border:2px solid transparent}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--ok);margin:0}
.chk.on{border-color:var(--ok);background:var(--ok2)}.chk.done{opacity:.6}
.chk b{flex:none;min-width:34px;text-align:right}.chk div{flex:1}.chk small{display:block;color:var(--ok);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--ok);transition:.3s}
.pill.cola{background:var(--line);color:var(--tx)}.card.st-cola{border-left-color:var(--mut)}
.pill.ruta{background:var(--ruta2);color:var(--ruta)}.card.st-ruta{border-left-color:var(--ruta)}
.tl{position:relative;margin:8px 0 0 8px;padding-left:18px;border-left:2px solid var(--line)}
.tl .ev{position:relative;padding:4px 0 10px}.tl .ev:before{content:"";position:absolute;left:-25px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--pri)}
.tl .ev.u:before{background:var(--pri)}.tl .ev small{display:block;color:var(--mut);font-size:12px}.tl .ev.it{padding-bottom:4px;font-size:13px}.tl .ev.it:before{width:8px;height:8px;left:-23px;border-color:var(--ok)}
.etapas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.etapas span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px}
.firma{width:100%;height:180px;background:#fff;border:1px dashed var(--line);border-radius:10px;touch-action:none;display:block}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;max-width:100%}
.firmaimg{background:#fff;border-radius:8px;width:100%;max-width:100%;margin-top:6px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px}.sec h3{margin:0}
.pill.fab{background:var(--fab2);color:var(--fab)}.card.st-fab{border-left-color:var(--fab)}
#nube{display:inline-block;margin-left:8px;font-size:12px;opacity:.95}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:none;padding:calc(30px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left,0px)) 30px max(16px,env(safe-area-inset-right,0px))}
#login.on{display:block}#login .in{max-width:420px;margin:auto}
#login h2{margin:0 0 4px;color:var(--pri)}.ubtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:8px;text-align:left}
.ubtn.on{border-color:var(--pri)}.ubtn small{color:var(--mut)}
.pin{letter-spacing:10px;font-size:24px;text-align:center}
.trc{display:flex;gap:10px;align-items:center}.trc div{flex:1;min-width:0}.trc .chip{flex:none}
.pdfpg{width:100%;border-radius:6px;margin-bottom:8px;background:#fff}
.load{text-align:center;color:var(--mut);padding:10px;font-size:14px}
</style>

<body>
<header><h1>📦 Entregas PT</h1><small id="hoyTxt"></small><small id="nube"></small></header>
<div id="login"><div class="in" id="loginIn"></div></div>
<main id="main"></main>
<button id="fab" onclick="abrirForm()" aria-label="Nueva orden">+</button>
<nav class="nav">
<button data-tab="hoy" onclick="ir('hoy')"><i>☀️</i>Hoy</button>
<button data-tab="inicio" onclick="ir('inicio')"><i>📋</i>Órdenes</button>
<button data-tab="prod" onclick="ir('prod')"><i>🏭</i>Producción</button>
<button data-tab="cal" onclick="ir('cal')"><i>📅</i>Calendario</button>
<button data-tab="ajustes" onclick="ir('ajustes')"><i>⚙️</i>Ajustes</button>
</nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="qrFile" accept="image/*" capture="environment" style="display:none" onchange="escanear(this.files[0]);this.value=''">
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-firestore-compat.js"></script>
<script>
/* ========= DATOS ========= */
const KEY='entregasPT_v1';
const LBL={cola:'En cola',ruta:'En ruta',fab:'En fabricación',pt:'En PT · sin fecha',ag:'Agendada',venc:'Vencida',desp:'Despachada'};
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let DB=load();DB.cfg=Object.assign(defaults().cfg,DB.cfg);setTimeout(()=>DB.ordenes.forEach(normalizar),0);
function defaults(){return{ordenes:[],cfg:{vendedores:['Vendedor 1','Vendedor 2','Vendedor 3'],dias:[1,2,3,4,5],cupo:4,choferes:[],vehiculos:[],diasLab:[1,2,3,4,5],tipos:[{n:'NLAB',d:3},{n:'NAB',d:8},{n:'Celda',d:15}],etapas:['Corte y doblez','Pintura','Armado','Cableado','Pruebas'],causas:['Cliente no tiene espacio','Falta transporte','Falta material','Atraso en fabricación','Pago pendiente','Error en la nota']}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.ordenes)&&d.cfg)return d}catch(e){}return defaults()}
function guardarLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function save(){guardarLocal();pushCambios()}
let S={tab:'hoy',filtro:'activas',vend:'',q:'',mes:null,dia:null};
let sheetOpen=false;

/* ========= UTILIDADES ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diasEntre=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const sumar=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>{if(!s)return'—';const d=parse(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)};
const ahora=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function est(o){if((o.envios||[]).some(e=>e.estado==='ruta'))return'ruta';if(o.despachada)return'desp';if(o.enCola)return'cola';if(o.enFab)return'fab';if(!o.fechaEntrega)return'pt';return o.fechaEntrega<hoy()?'venc':'ag'}
const byId=id=>DB.ordenes.find(o=>o.id===id);
const etq=o=>{const e=est(o);if(e==='desp')return o.entregada?'Entregada':'Despachada';if(e==='ruta')return(o.items||[]).some(i=>Math.max(0,(+i.cant>0?+i.cant:1)-(+i.ent||0))>0)?'En ruta · parcial':'En ruta';return((o.items||[]).some(i=>(+i.ent||0)>0)?'Parcial · ':'')+LBL[e]};

/* ========= ADJUNTOS (se guardan en el teléfono, IndexedDB) ========= */
const IDB=(()=>{let db;
 const open=()=>db?Promise.resolve(db):new Promise((ok,ko)=>{const r=indexedDB.open('entregasPT',1);r.onupgradeneeded=()=>r.result.createObjectStore('adj');r.onsuccess=()=>ok(db=r.result);r.onerror=()=>ko(r.error)});
 const tx=(m,f)=>open().then(d=>new Promise((ok,ko)=>{const t=d.transaction('adj',m),q=f(t.objectStore('adj'));t.oncomplete=()=>ok(q.result);t.onerror=()=>ko(t.error)}));
 return{put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))}})();

/* ========= LECTOR DE NOTAS DE ENTREGA ========= */
let PDFJS=null;
async function pdfjs(){if(PDFJS)return PDFJS;const m=await import('./lib/pdf.min.js');m.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';return PDFJS=m}
const NUM=/^\d+(?:[.,]\d+)*$/;
function toNum(s){s=String(s).trim();
 if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
 else if(s.includes(','))s=s.replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 const n=parseFloat(s);return isNaN(n)?'':+n.toFixed(2)}
// 1) Lee el PDF y arma las líneas de texto con su posición en la hoja
async function leerPDF(buf){const lib=await pdfjs();const doc=await lib.getDocument({data:buf}).promise;const lines=[];
 for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r)rows.push(r={y,its:[]});r.its.push({s:it.str,x,w:it.width||it.str.length*4})});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.its.sort((a,b)=>a.x-b.x);const m=[];
   r.its.forEach(i=>{const u=m[m.length-1];if(u&&i.x-(u.x+u.w)<3){u.s+=(i.x-(u.x+u.w)>.8?' ':'')+i.s;u.w=i.x+i.w-u.x}else m.push({...i})});
   lines.push(m.map(c=>({...c,s:c.s.trim()})).filter(c=>c.s))})}
 return lines}
const txt=l=>l.map(c=>c.s).join(' ');
const RX_FIN=/(sub-?total|^total|\btotal\b|base imponible|\bi\.?v\.?a\b|observaci|son:|recibido|recib[ií] conforme|firma|neto a pagar)/i;
const RX_NO=/(r\.?i\.?f|tel[eé]f|fecha|direcci|p[aá]gina|cliente|vendedor|nota de entrega|condici)/i;
const tipoCol=s=>{s=s.toLowerCase();if(/cant/.test(s))return'cant';if(/desc|art[ií]c|produc|concep|detalle/.test(s))return'desc';return'otro'};
// 2) Busca la fila de títulos (Cantidad / Descripción) y lee la tabla columna por columna
function extraerItems(lines){const items=[];let cols=null,tabla=false;
 for(const l of lines){const t=txt(l),tl=t.toLowerCase();
  if(/cant/.test(tl)&&/(desc|art[ií]c|produc|concep|detalle)/.test(tl)){cols=l.map(c=>({k:tipoCol(c.s),x:c.x,c:c.x+c.w/2}));cols.forEach((k,j)=>{k.a=j?(cols[j-1].c+k.c)/2:-1e9;k.b=j<cols.length-1?(k.c+cols[j+1].c)/2:1e9});tabla=cols.some(c=>c.k==='cant')&&cols.some(c=>c.k==='desc');continue}
  if(!tabla)continue;if(RX_FIN.test(tl)){tabla=false;continue}
  let cant='';const desc=[];
  l.forEach(c=>{const n=NUM.test(c.s.replace(/^[$]\s*/,''));const col=colDe(cols,c);
   if(col.k==='cant'&&n&&cant==='')cant=c.s;else if(col.k==='desc')desc.push(c.s)});
  const d=desc.join(' ').trim();if(!d)continue;
  if(cant!=='')items.push({desc:d,cant:toNum(cant)});else if(items.length)items[items.length-1].desc+=' '+d}
 return items.length?items:extraerSimple(lines)}
// Asigna cada texto a la columna con la que más se solapa (sirve con títulos centrados o alineados a la izquierda)
function colDe(cols,c){const x1=c.x,x2=c.x+Math.max(c.w,2);let best=cols[0],bo=-1;cols.forEach(k=>{const o=Math.min(x2,k.b)-Math.max(x1,k.a);if(o>bo){bo=o;best=k}});return best}
// 3) Plan B si la nota no tiene títulos claros: líneas que empiezan con una cantidad
function extraerSimple(lines){const r=[];lines.forEach(l=>{const t=txt(l);if(l.length<2||RX_FIN.test(t)||RX_NO.test(t)||!NUM.test(l[0].s))return;
 const q=toNum(l[0].s);if(!q||q>9999)return;const rest=l.slice(1);while(rest.length&&NUM.test(rest[rest.length-1].s.replace(/[$Bs\s]/g,'')))rest.pop();
 const d=txt(rest);if(/[a-záéíóúñ]{3}/i.test(d))r.push({desc:d,cant:q})});return r}
function extraerDatos(lines){const r={nota:'',cliente:'',vendedor:'',plazo:''},esLbl=s=>/:\s*$/.test(s);
 lines.forEach(l=>l.forEach((c,k)=>{const s=c.s.toLowerCase(),sig=l[k+1]&&!esLbl(l[k+1].s)?l[k+1].s:'';

function durMs(ms){const m=Math.max(0,ms/6e4);return m<60?Math.round(m)+' min':m<2880?Math.round(m/60)+' h':Math.round(m/1440)+' d'}
function dur(a,b){if(!a||!b)return'';return durMs(new Date(b)-new Date(a))}
const hora=t=>new Date(t).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

 (o.notas||[]).forEach(n=>ev.push({t:n.t,c:n.sis?'':'u',h:(n.sis?'':'💬 ')+esc(n.txt),por:n.a}));
 (o.items||[]).forEach(i=>{if(i.t&&i.por)ev.push({t:i.t,c:'it',h:'✓ Verificó '+esc(i.cant)+' '+esc(i.desc.slice(0,60)),por:i.por})});
 (o.envios||[]).forEach(e=>{if(e.entrega)ev.push({t:e.entrega.t,c:'u',h:`<b>✅ Entregado envío #${e.n}</b> · recibió ${esc(e.entrega.recibe)}${e.entrega.ci?' (C.I. '+esc(e.entrega.ci)+')':''}${e.entrega.obs?' · '+esc(e.entrega.obs):''}`,por:e.entrega.por})});
 if(false)ev.push({t:o.tEntrega,c:'u',h:`<b>✅ Entregada</b> · recibió ${esc(o.entrega.recibe)}${o.entrega.ci?' (C.I. '+esc(o.entrega.ci)+')':''}${o.entrega.obs?' · '+esc(o.entrega.obs):''}`,por:o.entrega.por});
 ev.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
 const base=o.tPT||(o.fechaPT?o.fechaPT+'T08:00:00':''),et=[];
 if(o.creada&&o.tPT)et.push('🔧 Fabricación '+dur(o.creada,o.tPT));
 if(base&&o.tSalida)et.push('📦 En PT '+dur(base,o.tSalida));
 if(o.tSalida&&o.tEntrega)et.push('🛣 Ruta '+dur(o.tSalida,o.tEntrega));
 if(o.creada&&o.tEntrega)et.push('⏱ Total '+dur(o.creada,o.tEntrega));
 return(et.length?`<div class="etapas">${et.map(x=>`<span>${x}</span>`).join('')}</div>`:'')+
 (ev.length?`<div class="tl">${ev.map(e=>`<div class="ev ${e.c}">${e.h}<small>${e.por?esc(e.por)+' · ':''}${hora(e.t)}</small></div>`).join('')}</div>`:'<div class="mut sm">Sin movimientos todavía.</div>')}

 const s=Math.min(1,(max||1280)/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return new Promise(ok=>c.toBlob(ok,'image/jpeg',q||.7))}
function padFirma(cv){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';let d=false;cv._vacia=true;const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{d=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}x.beginPath();x.moveTo(...p(e))};cv.onpointermove=e=>{if(!d)return;x.lineTo(...p(e));x.stroke();cv._vacia=false};cv.onpointerup=cv.onpointercancel=()=>d=false;

async function etiqueta(id){const o=byId(id),u=qrURL('EPT:'+o.id,12);if(!u)return toast('El generador de QR no está disponible en esta versión');
 const W=900,H=520,c=document.createElement('canvas'),x=c.getContext('2d');c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#111';x.lineWidth=4;x.strokeRect(10,10,W-20,H-20);
 const im=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=u});x.drawImage(im,30,60,400,400);
 let y=110;const T=(s,sz,b)=>{x.font=`${b?'700':'400'} ${sz}px sans-serif`;x.fillStyle='#111';let line='';for(const w of String(s).split(' ')){if(x.measureText(line+w).width>W-470&&line){x.fillText(line.trim(),450,y);y+=sz*1.25;line=''}line+=w+' '}x.fillText(line.trim(),450,y);y+=sz*1.3};
 T('OT '+o.ot,70,1);T(o.cliente,30,1);if(o.nota)T('Nota '+o.nota,28);T(o.producto.slice(0,80),24);if(o.items?.length)T(o.items.length+' ítems',24);
 x.font='20px sans-serif';x.fillStyle='#666';x.fillText('Entregas PT · escanea para abrir la OT',450,H-40);
 const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));compartirImg(blob,'etiqueta-OT-'+o.ot+'.png','Etiqueta OT '+o.ot,'🏷 Etiqueta QR')}
async function leerQR(file){const url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
 const s=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(c);if(r&&r[0])return r[0].rawValue}catch(e){}}
 if(window.jsQR){const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height);if(r)return r.data}return null}

 if(!v)return toast('No encontré un QR. Toma la foto de cerca y con buena luz.');const id=v.startsWith('EPT:')?v.slice(4):'';const o=byId(id)||DB.ordenes.find(x=>x.ot===v.trim());

/* ========= PRODUCCIÓN: cola de aprobadas, etapas y fechas límite ========= */
const esLab=s=>DB.cfg.diasLab.includes(parse(s).getDay());
function sumarLab(s,n){let d=s,k=0;while(k<n){d=sumar(d,1);if(esLab(d))k++}return d}
function restarLab(s,n){let d=s,k=0;while(k<n){d=sumar(d,-1);if(esLab(d))k++}return d}
function labEntre(a,b){if(!a||!b)return 0;let n=0,d=a;while(d<b){d=sumar(d,1);if(esLab(d))n++}return n}
function tipoDe(txt){const T=String(txt||'').toUpperCase();const ts=[...DB.cfg.tipos].sort((a,b)=>b.n.length-a.n.length);
 const t=ts.find(t=>new RegExp('\\b'+t.n.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(T));return t?t.n:''}
const diasTipo=n=>(DB.cfg.tipos.find(t=>t.n===n)||{}).d||0;
const diasDe=o=>+o.diasEst||diasTipo(o.tipo)||0;
const compromiso=o=>o.fechaCompromiso||o.fechaEntrega||'';
function avanceFab(o){const e=o.etapas||[];return e.length?e.filter(x=>x.ok).length/e.length:0}
function finEstimado(o){const d=diasDe(o);if(!d)return'';const rest=Math.ceil(d*(1-avanceFab(o)));if(!rest)return hoy();
 const ini=o.tInicio?o.tInicio.slice(0,10):hoy(),porPlan=sumarLab(ini,d),porAvance=sumarLab(hoy(),rest);return porAvance>porPlan?porAvance:porPlan}
function limiteInicio(o){const c=compromiso(o),d=diasDe(o);return c&&d?restarLab(c,d):''}
function holgura(o){const l=limiteInicio(o);if(!l)return null;return l<hoy()?-labEntre(l,hoy()):labEntre(hoy(),l)}
function estadoCola(o){const h=holgura(o);if(h===null)return{c:'',t:diasDe(o)?'Sin fecha compromiso':'Falta tipo o días'};
 if(h<0)return{c:'bad',t:`Atrasada: debió iniciar el ${fmt(limiteInicio(o))}`};if(h===0)return{c:'ag',t:'Iniciar HOY para cumplir'};
 return{c:h<=2?'ag':'desp',t:`Iniciar a más tardar ${fmt(limiteInicio(o))} · ${h} día(s) de holgura`}}
function riesgoFab(o){const f=finEstimado(o),c=compromiso(o);return f&&c&&f>c}
function iniciarFab(id,motivo){const o=byId(id);o.enCola=false;o.enFab=true;o.tInicio=ahora();o.etapas=DB.cfg.etapas.map(n=>({n,ok:false}));
 o.notas.push({t:ahora(),a:quien(),sis:1,txt:'Inició fabricación'+(motivo?' ('+motivo+')':'')+(diasDe(o)?' · fin estimado '+fmt(finEstimado(o)):'')});return o}
function confIniciar(id){const o=byId(id),fin=sumarLab(hoy(),diasDe(o)),c=compromiso(o);
 preguntar(`¿Iniciar la fabricación de la OT ${esc(o.ot)}?${diasDe(o)?`<div class="mut sm" style="font-weight:400;margin-top:6px">${esc(o.tipo||'')} · ${diasDe(o)} días hábiles → terminaría el ${fmt(fin)}${c?(fin>c?` <b style="color:var(--bad)">después del compromiso (${fmt(c)})</b>`:` (compromiso ${fmt(c)})`):''}</div>`:''}`,
  ()=>{iniciarFab(id);save();closeSheet();render();toast('🔧 Fabricación iniciada')},'🔧 Sí, iniciar',0)}
function etapa(id,k,el){const o=byId(id),e=o.etapas[k];e.ok=el?el.checked:!e.ok;if(e.ok){e.t=ahora();e.por=quien()}else{delete e.t;delete e.por}
 if(e.ok)o.notas.push({t:ahora(),a:quien(),sis:1,txt:'Terminó etapa: '+e.n});save();
 if(o.etapas.every(x=>x.ok)){const sig=colaOrdenada()[0];preguntar(`✅ La OT ${esc(o.ot)} terminó todas las etapas. ¿Pasa a producto terminado?${sig?`<div class="mut sm" style="font-weight:400;margin-top:6px">Se libera capacidad. Siguiente sugerida: <b>OT ${esc(sig.ot)}</b> · ${esc(estadoCola(sig).t)}</div>`:''}`,()=>{llegoPT(id);if(sig)setTimeout(()=>avisar('🏭 Capacidad libre','Siguiente sugerida: OT '+sig.ot),300)},'📦 Sí, pasa a PT',0,()=>{closeSheet();render()});return}
 if(S.vista==='ver'){const y=$('#sheetBody').scrollTop;ver(id);$('#sheetBody').scrollTop=y}render()}
function colaOrdenada(){return misOrdenes().filter(o=>o.enCola&&!o.despachada).sort((a,b)=>{const ha=holgura(a),hb=holgura(b);
 if(!!a.urgente!==!!b.urgente)return a.urgente?-1:1;if(ha===null&&hb===null)return(a.creada||'').localeCompare(b.creada||'');if(ha===null)return 1;if(hb===null)return-1;return ha-hb})}
function etapasHTML(o){const e=o.etapas||[];if(!e.length||!o.enFab)return'';const p=avanceFab(o),f=finEstimado(o),c=compromiso(o);
 return`<h3 style="margin-top:20px" class="row">🏭 Etapas de fabricación <span class="pill ${riesgoFab(o)?'bad':'fab'}">${Math.round(p*100)}%</span></h3>
 <div class="bar"><i style="width:${p*100}%;background:var(--fab)"></i></div>

 ${e.map((x,k)=>`<label class="chk ${x.ok?'on':''}"><input type="checkbox" ${x.ok?'checked':''} ${puede('crear')?'':'disabled'} onchange="etapa('${o.id}',${k},this)"><div>${esc(x.n)}${x.ok?`<small>✓ ${esc(x.por||'')} · ${x.t?hora(x.t):''}</small>`:''}</div></label>`).join('')}`}
function cardProd(o){const c=compromiso(o);let extra='';
 if(o.enCola){const s=estadoCola(o);extra=`<div class="sm" style="margin-top:6px;font-weight:600;color:var(--${s.c==='bad'?'bad':s.c==='ag'?'ag':'mut'})">${esc(s.t)}</div>${puede('crear')?`<div class="grid2" style="margin-top:4px"><button class="btn" style="margin:6px 0 0" onclick="event.stopPropagation();confIniciar('${o.id}')">🔧 Iniciar fabricación</button></div>`:''}`}
 else if(o.enFab){const p=avanceFab(o),sig=(o.etapas||[]).find(x=>!x.ok),k=(o.etapas||[]).indexOf(sig);
  extra=`<div class="bar" style="margin:8px 0 4px"><i style="width:${p*100}%;background:var(--fab)"></i></div><div class="row sm"><span class="mut">${sig?'Etapa actual: '+esc(sig.n):'Todas las etapas listas'}</span><b style="color:var(--${riesgoFab(o)?'bad':'mut'})">${finEstimado(o)?'Fin '+fmt(finEstimado(o)):''}${riesgoFab(o)?' ⚠':''}</b></div>
  ${sig&&puede('crear')?`<button class="btn sec" style="margin:6px 0 0" onclick="event.stopPropagation();etapa('${o.id}',${k})">✓ Terminé ${esc(sig.n)}</button>`:''}`}
 return`<div class="card st-${est(o)}" onclick="ver('${o.id}')"><div class="row"><b class="ot">OT ${esc(o.ot)}</b>${o.urgente?'<span class="pill bad">Urgente</span>':''}<span class="pill ${est(o)}">${etq(o)}</span></div>
 <div class="cli">${esc(o.cliente)}</div><div class="prod">${esc(o.producto)}</div><div class="row mut sm"><span>${o.tipo?'🏷 '+esc(o.tipo)+(diasDe(o)?' · '+diasDe(o)+' d':''):'🏷 Sin tipo'}</span><span>${c?'📌 Compromiso '+fmt(c):''}</span></div>${extra}</div>`}
function vProd(){const fab=misOrdenes().filter(o=>o.enFab&&!o.despachada).sort((a,b)=>(finEstimado(a)||'9').localeCompare(finEstimado(b)||'9')),cola=colaOrdenada();
 const riesgo=fab.filter(riesgoFab).length+cola.filter(o=>{const h=holgura(o);return h!==null&&h<0}).length,hoyIni=cola.filter(o=>holgura(o)===0).length;
 const k=(v,l,cls)=>`<div class="kpi ${cls&&v?cls:''}"><b>${v}</b><span>${l}</span></div>`;

 <div class="kpis">${k(fab.length,'En fabricación')}${k(cola.length,'En cola')}${k(hoyIni,'Iniciar hoy','red')}${k(riesgo,'En riesgo','red')}</div>
 <div class="mut sm">Carga pendiente en fabricación: <b>${restante} día(s) hábil(es)</b> de trabajo sumando todas las OT.</div>

 ${vTiemposReales()}`}
function vTiemposReales(){const g={};DB.ordenes.filter(o=>o.tipo&&o.tInicio&&o.tPT).forEach(o=>{(g[o.tipo]=g[o.tipo]||[]).push(Math.max(1,labEntre(o.tInicio.slice(0,10),o.tPT.slice(0,10))))});
 const R=Object.entries(g);if(!R.length)return'';
 return`<div class="box" style="margin-top:16px"><h3 style="margin-top:0">📏 Tiempos reales vs estimados</h3><table><tr><th>Tipo</th><th>OT</th><th>Real prom.</th><th>Estimado</th><th></th></tr>${R.map(([t,L])=>{const p=L.reduce((a,b)=>a+b,0)/L.length,e=diasTipo(t),r=Math.round(p);

 <div id="avL" style="margin-top:10px">${ok.map(o=>{const n=(o.items||[]).filter(i=>pend(i)>0).length,s=selVerif(o).length;return`<label class="chk"><input type="checkbox" value="${o.id}" ${o.fechaEntrega===t&&!esParcialSel(o)?'checked':''}><div><b>OT ${esc(o.ot)}</b> · ${esc(o.cliente)}<small style="color:var(--mut)">${o.fechaEntrega?(o.fechaEntrega===t?'Para hoy':fmt(o.fechaEntrega)):'Sin fecha'}${n?` · ${s}/${n} ítems verificados`:''}${esParcialSel(o)?' · saldría parcial':''}${esParcial(o)?' · ya tiene envíos':''}</small></div></label>`}).join('')||'<div class="mut">No hay OT con ítems verificados.</div>'}</div>
 ${no.length?`<div class="mut sm" style="margin-top:10px">Sin ítems verificados: ${no.map(o=>'OT '+esc(o.ot)).join(', ')}</div>`:''}
 ${ok.length?`<button class="btn" onclick="const ids=[...document.querySelectorAll('#avL input:checked')].map(x=>x.value);if(!ids.length)return toast('Marca al menos una OT');hojaSalida(ids,'armarViaje()')">Continuar</button>`:''}<button class="btn sec" onclick="closeSheet()">Cerrar</button>`)}
function viajesEnCurso(){const g={};misOrdenes().forEach(o=>enviosRuta(o).forEach(e=>{const k=e.viaje?.id||'s-'+e.id;(g[k]=g[k]||{v:e.viaje||{},L:[]}).L.push({o,e})}));
 return Object.values(g).map(({v,L})=>`<div class="box" style="padding:10px 12px;margin-bottom:8px"><div class="row"><b>🚛 ${esc(v.chofer||'Sin chofer')}${v.vehiculo?' · '+esc(v.vehiculo):''}</b><span class="mut sm">salió ${v.salida?new Date(v.salida).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''} · ${L.length} envío(s)</span></div></div>${L.map(({o,e})=>card(o).replace('</div>`','</div>')+(o.envios.length>1||esParcial(o)?`<div class="mut sm" style="margin:-6px 0 10px 8px">↳ Envío #${e.n}: ${e.items.length} ítem(s)${(o.items||[]).some(i=>pend(i)>0)?' · quedan pendientes':''}</div>`:'')).join('')}`).join('')}
function regreso(vid){const t=ahora();let n=0;DB.ordenes.forEach(o=>(o.envios||[]).forEach(e=>{if(e.viaje?.id===vid){e.viaje={...e.viaje,regreso:t};n++;if(!o.notas.some(x=>x.t===t))o.notas.push({t,a:quien(),sis:1,txt:'El vehículo regresó al galpón'});sincronizar(o)}}));save();render();toast('🏁 Regreso registrado')}
function viajesTerminados(){const t=hoy(),g={};DB.ordenes.forEach(o=>(o.envios||[]).forEach(e=>{if(e.viaje?.id&&e.salida.slice(0,10)===t)(g[e.viaje.id]=g[e.viaje.id]||{v:e.viaje,E:[]}).E.push(e)}));
 const V=Object.values(g).filter(x=>x.E.every(e=>e.estado==='entregado'));if(!V.length)return'';
 return`<div class="sec"><h3>🏁 Viajes de hoy</h3><span class="pill">${V.length}</span></div>${V.map(({v,E})=>`<div class="box" style="padding:10px 12px;margin-bottom:8px"><div class="row"><b>🚛 ${esc(v.chofer||'Sin chofer')}${v.vehiculo?' · '+esc(v.vehiculo):''}</b><span class="mut sm">${E.length} envío(s) entregado(s)</span></div>
  <div class="mut sm">Salió ${new Date(v.salida).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}${v.regreso?' · regresó '+new Date(v.regreso).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+' · '+dur(v.salida,v.regreso)+' fuera':''}</div>
  ${!v.regreso&&puede('despachar')?`<button class="btn sec" onclick="regreso('${v.id}')">🏁 Regresó al galpón</button>`:''}</div>`).join('')}`}
function detectar(prev,d,por){if(!USR||!prev||por===USR.nombre)return;if(USR.rol==='vend'&&(d.vendedor||'').toLowerCase()!==USR.nombre.toLowerCase())return;
 const t=hoy(),man=sumar(t,1),r=USR.rol,pe=prev.envios||[],de=d.envios||[];
 const entP=pe.filter(e=>e.estado==='entregado').length,entD=de.filter(e=>e.estado==='entregado').length;
 if(entD>entP&&r!=='desp'){const e=de.filter(x=>x.estado==='entregado').pop();return avisar('✅ Entregado OT '+d.ot+(de.length>1?' · envío #'+e.n:''),d.cliente+(e.entrega?.recibe?' · recibió '+e.entrega.recibe:''),d.id)}
 if(de.length>pe.length&&r!=='desp'){const e=de[de.length-1],q=(d.items||[]).filter(i=>pend(i)>0).length;return avisar('🛣 Salió OT '+d.ot+(q?' (parcial)':''),d.cliente+(e.viaje?.chofer?' · '+e.viaje.chofer:'')+(q?' · quedan '+q+' ítems':''),d.id)}
 if(d.fechaEntrega&&d.fechaEntrega!==prev.fechaEntrega&&!d.despachada&&(d.fechaEntrega===t||d.fechaEntrega===man)&&r!=='sup')return avisar('📅 OT '+d.ot+' para '+(d.fechaEntrega===t?'hoy':'mañana'),d.cliente+(esParcial(d)?' · resto de la nota':''),d.id);
 if(prev.enFab&&!d.enFab&&r==='desp')return avisar('📦 OT '+d.ot+' lista en PT',d.cliente,d.id)}
/* plazo de la nota en días hábiles (lunes a viernes) */
function sumarLV(s,n){let d=s,k=0;while(k<n){d=sumar(d,1);const w=parse(d).getDay();if(w>0&&w<6)k++}return d}
function leerPlazo(txt){const t=String(txt||'');if(!t.trim())return null;const m=t.match(/(\d+)\s*(?:a\s*\d+\s*)?(d[ií]as?|semanas?)/i);if(!m)return{txt:t.trim(),dias:0};
 let n=+m[1];if(/semana/i.test(m[2]))n*=5;else if(/continu|calendari|corrid|naturales/i.test(t))n=Math.round(n*5/7);return{txt:t.trim(),dias:n}}
function calcComp(){const n=+$('#fPlazo').value,b=$('#fBase').value||hoy();const el=$('#fPlazoTxt');
 if(n>0){const c=sumarLV(b,n);$('#fComp').value=c;el.innerHTML=`✓ ${n} día(s) hábil(es) de lunes a viernes desde el ${fmt(b)} → <b>compromiso ${fmt(c)}</b>`}else el.textContent=FORM.plazoTxt?'La nota dice: "'+FORM.plazoTxt+'". Escribe los días si se acordaron.':''}
/* ========= CALENDARIO ========= */
function vCal(){if(!S.mes){const d=new Date();S.mes=[d.getFullYear(),d.getMonth()]}if(!S.dia)S.dia=hoy();
 const[y,m]=S.mes,first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=hoy();
 let c=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(off);
 for(let i=1;i<=n;i++){const s=iso(new Date(y,m,i)),k=carga(s),cl=[!esDiaDesp(s)?'off':'',k>=DB.cfg.cupo?'full':k?'some':'',s===t?'today':'',s===S.dia?'sel':''].join(' ');
  c+=`<div class="day ${cl}" onclick="S.dia='${s}';render()">${i}${k?`<em>${k}/${DB.cfg.cupo}</em>`:''}</div>`}
 const L=DB.ordenes.filter(o=>o.fechaEntrega===S.dia||o.fechaDespacho===S.dia),k=carga(S.dia),sin=DB.ordenes.filter(o=>est(o)==='pt').length;
 return`<div class="calhead"><button onclick="mes(-1)">‹</button><b style="text-transform:capitalize">${MESES[m]} ${y}</b><button onclick="mes(1)">›</button></div>
 <div class="cal">${c}</div>
 <div class="leg"><span><i style="background:var(--ag2)"></i>Con entregas</span><span><i style="background:var(--bad2)"></i>Lleno</span><span><i style="background:var(--card);opacity:.4"></i>No despacha</span></div>
 <div class="row" style="margin:14px 0 8px"><b>${fmt(S.dia)}</b><span class="mut sm">${esDiaDesp(S.dia)?k+'/'+DB.cfg.cupo+' cupos usados':'No es día de despacho'}</span></div>
 ${L.map(card).join('')||'<div class="empty" style="padding:16px">Sin entregas este día</div>'}
 ${esDiaDesp(S.dia)&&k<DB.cfg.cupo&&S.dia>=t&&sin?`<button class="btn sec" onclick="asignarDia()">➕ Asignar una orden sin fecha (${sin})</button>`:''}`}
function mes(d){let[y,m]=S.mes;m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}S.mes=[y,m];render()}
function asignarDia(){const L=DB.ordenes.filter(o=>est(o)==='pt');
 openSheet(`<h3>Asignar al ${fmt(S.dia)}</h3>${L.map(o=>`<div class="card" onclick="asignar('${o.id}')"><b>OT ${esc(o.ot)}</b> · ${esc(o.cliente)}<div class="prod">${esc(o.producto)} · 👤 ${esc(o.vendedor||'—')}</div></div>`).join('')}<button class="btn sec" onclick="closeSheet()">Cancelar</button>`)}
function asignar(id){const o=byId(id);o.fechaEntrega=S.dia;o.notas.push({t:ahora(),a:quien(),sis:1,txt:'Agendada para '+fmt(S.dia)});save();closeSheet();render();toast('Asignada al '+fmt(S.dia))}

/* ========= AJUSTES E INDICADORES ========= */
function vAjustes(){const c=DB.cfg;
 const ses=`<div class="box"><div class="kv"><span>Sesión</span><b>${esc(USR.nombre)} · ${ROLES[USR.rol]}</b></div><div class="kv"><span>Datos</span><b>${NUBE.on?'☁️ Compartidos en la nube':'📱 Solo en este teléfono'}</b></div>${NUBE.on?'<button class="btn sec" onclick="cerrarSesion()">Cerrar sesión</button>':''}</div>`;
 const D=DB.ordenes.filter(o=>o.despachada&&o.fechaEntrega&&o.fechaDespacho);
 const at=D.filter(o=>o.fechaDespacho<=o.fechaEntrega).length,pct=D.length?Math.round(at/D.length*100):0;
 const conPT=D.filter(o=>o.fechaPT),prom=conPT.length?(conPT.reduce((s,o)=>s+diasEntre(o.fechaPT,o.fechaDespacho),0)/conPT.length).toFixed(1):'—';
 const rep=DB.ordenes.reduce((s,o)=>s+(o.reprog||0),0);
 const filas=c.vendedores.map(v=>{const d=D.filter(o=>o.vendedor===v),a=d.filter(o=>o.fechaDespacho<=o.fechaEntrega).length,r=DB.ordenes.filter(o=>o.vendedor===v).reduce((s,o)=>s+(o.reprog||0),0),p=DB.ordenes.filter(o=>o.vendedor===v&&!o.despachada).length;
  return`<tr><td>${esc(v)}</td><td>${p}</td><td>${d.length}</td><td>${d.length?Math.round(a/d.length*100)+'%':'—'}</td><td>${r}</td></tr>`}).join('');
 return ses+`<div class="box"><h3 style="margin-top:0">📈 Mejora continua</h3>
 <div class="grid2"><div><div class="big" style="color:${pct>=90?'var(--ok)':pct>=70?'var(--ag)':'var(--bad)'}">${D.length?pct+'%':'—'}</div><div class="mut sm">Entregas a tiempo (${at}/${D.length})</div></div>
 <div><div class="big">${prom}</div><div class="mut sm">Días promedio de PT a despacho</div></div></div>
 ${(()=>{const EV=DB.ordenes.flatMap(o=>o.envios||[]).filter(e=>e.entrega),E=EV,pr=E.length?E.reduce((s,e)=>s+(new Date(e.entrega.t)-new Date(e.salida)),0)/E.length:0,ent=EV,con=EV.filter(e=>e.entrega.firma||e.entrega.fotos?.length).length;
  return`<div class="kv" style="margin-top:8px"><span>Tiempo promedio en ruta</span><b>${E.length?durMs(pr):'—'}</b></div><div class="kv"><span>Entregas con prueba (firma o foto)</span><b>${ent.length?Math.round(con/ent.length*100)+'%':'—'}</b></div>`})()}
 <div class="kv"><span>Reprogramaciones totales</span><b>${rep}</b></div><div class="kv"><span>Despachos parciales</span><b>${DB.ordenes.reduce((s,o)=>s+(o.parciales||0),0)}</b></div>
 <table style="margin-top:8px"><tr><th>Vendedor</th><th>Activas</th><th>Desp.</th><th>A tiempo</th><th>Reprog.</th></tr>${filas}</table>
 <div class="mut sm" style="margin-top:8px">Meta sugerida: 90% a tiempo. Revisa los motivos de reprogramación en las notas para atacar la causa más repetida.</div></div>
 ${vCausas()}${puede('ajustes')?`${NUBE.on?vUsuarios():''}${vTrello()}${vTiposEtapas()}${vListas()}<div class="box"><h3 style="margin-top:0">👥 Vendedores</h3>${c.vendedores.map((v,i)=>`<div class="vrow"><input value="${esc(v)}" onchange="renV(${i},this.value)"><button onclick="delV(${i})">✕</button></div>`).join('')}
 <button class="btn sec" onclick="addV()">➕ Agregar vendedor</button></div>
 <div class="box"><h3 style="margin-top:0">🚚 Días de despacho</h3><div class="radio">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${c.dias.includes(d)?'on':''}" onclick="togD(${d})">${DIAS[d]}</button>`).join('')}</div>
 <label>Máximo de entregas por día</label><div class="grid2" style="grid-template-columns:50px 1fr 50px"><button class="btn sec" style="margin:0" onclick="cupo(-1)">−</button><div class="big" style="text-align:center">${c.cupo}</div><button class="btn sec" style="margin:0" onclick="cupo(1)">+</button></div></div>
 <div class="box"><h3 style="margin-top:0">💾 Respaldo</h3><div class="mut sm">${NUBE.on?'Los datos se guardan en la nube y en cada teléfono. Igual puedes copiar un respaldo de órdenes, ítems y notas.':'Los datos se guardan solo en este teléfono. Haz un respaldo de vez en cuando y guárdalo en WhatsApp o Drive.'}</div>
 <button class="btn sec" onclick="copiar(JSON.stringify(DB))">📋 Copiar respaldo</button><button class="btn sec" onclick="restaurar()">♻️ Restaurar respaldo</button><button class="btn sec" onclick="copiar(csv())">📊 Copiar tabla para Excel</button></div>`:''}
 <div class="mut sm" style="text-align:center">Entregas PT v2.4 · ${DB.ordenes.length} órdenes registradas</div>`}
function renV(i,v){v=v.trim();if(!v)return render();const old=DB.cfg.vendedores[i];DB.cfg.vendedores[i]=v;DB.ordenes.forEach(o=>{if(o.vendedor===old)o.vendedor=v});save();toast('Vendedor actualizado')}
function delV(i){preguntar('¿Quitar a '+esc(DB.cfg.vendedores[i])+'? Sus órdenes se conservan.',()=>{DB.cfg.vendedores.splice(i,1);save();closeSheet();render()},'Quitar',1)}
function addV(){openSheet(`<h3>Nuevo vendedor</h3><label for="vN">Nombre (como sale en las notas)</label><input id="vN" placeholder="Ej: ARNALDO RIVERO"><button class="btn" onclick="const v=$('#vN').value.trim();if(!v)return toast('Escribe el nombre');DB.cfg.vendedores.push(v);save();closeSheet();render()">Agregar</button><button class="btn sec" onclick="closeSheet()">Cancelar</button>`);setTimeout(()=>$('#vN')?.focus(),50)}
function togD(d){const a=DB.cfg.dias;a.includes(d)?a.splice(a.indexOf(d),1):a.push(d);if(!a.length){a.push(d);return toast('Debe haber al menos un día')}save();render()}
function cupo(d){DB.cfg.cupo=Math.max(1,Math.min(50,DB.cfg.cupo+d));save();render()}
function csv(){const h=['OT','Nota entrega','Cliente','Producto','Cantidad','Vendedor','Llegó a PT','Entrega programada','Despachada','Entregada','Recibió','Chofer','Vehículo','Tipo','Compromiso','Inicio fabricación','Estado','Reprogramaciones','Ítems','Notas'];
 const r=DB.ordenes.map(o=>[o.ot,o.nota,o.cliente,o.producto,o.cant,o.vendedor,o.fechaPT,o.fechaEntrega,o.fechaDespacho||'',o.fechaEntregado||'',o.entrega?.recibe||'',o.viaje?.chofer||'',o.viaje?.vehiculo||'',o.tipo||'',o.fechaCompromiso||'',o.tInicio?o.tInicio.slice(0,10):'',etq(o),o.reprog||0,(o.items||[]).map(i=>i.cant+' '+i.desc+(i.d?' ✓':'')).join(' | '),(o.notas||[]).map(n=>n.a+': '+n.txt).join(' | ')]);
 return[h,...r].map(x=>x.map(v=>String(v??'').replace(/\t|\n/g,' ')).join('\t')).join('\n')}
function restaurar(){openSheet(`<h3>Restaurar respaldo</h3><div class="mut sm">Pega aquí el texto del respaldo. Reemplazará los datos actuales.</div><textarea id="rT" rows="8"></textarea><button class="btn" onclick="confRest()">Restaurar</button><button class="btn sec" onclick="closeSheet()">Cancelar</button>`)}
function confRest(){try{const d=JSON.parse($('#rT').value);if(!Array.isArray(d.ordenes)||!d.cfg)throw 0;preguntar('¿Reemplazar todos los datos actuales por el respaldo?',()=>{DB=d;save();closeSheet();render();toast('Respaldo restaurado')},'♻️ Sí, reemplazar',1)}catch(e){toast('Texto de respaldo no válido')}}

arranque();
</script>
